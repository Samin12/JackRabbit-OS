<!doctype html>
<html><head><meta charset="utf-8"><title>mock camera</title>
<style>
  html,body{margin:0;width:960px;height:720px;overflow:hidden}

  .glow{position:absolute;inset:0;background:radial-gradient(420px 300px at 70% 15%,rgba(255,250,235,.6),transparent 70%)}
  .bokeh{position:absolute;border-radius:50%;filter:blur(18px);opacity:.5}
  svg{position:absolute;left:0;top:0;filter:drop-shadow(0 18px 24px rgba(40,25,10,.35))}
  .grain{position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 40%,rgba(0,0,0,.03) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(30,20,10,.45))}
</style></head><body>
